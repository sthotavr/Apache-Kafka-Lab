AWSTemplateFormatVersion: "2010-09-09"
Description: Sri single-node Apache Kafka on EC2 in its own VPC (lab).

Resources:
  SriVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: sri-vpc

  SriInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: sri-igw

  SriGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SriVpc
      InternetGatewayId: !Ref SriInternetGateway

  SriPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SriVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-2a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: sri-public-subnet

  SriPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SriVpc
      Tags:
        - Key: Name
          Value: sri-public-rt

  SriPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SriGatewayAttachment
    Properties:
      RouteTableId: !Ref SriPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SriInternetGateway

  SriPublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SriPublicSubnet
      RouteTableId: !Ref SriPublicRouteTable

  SriKafkaSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "sri-kafka-admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  SriKafkaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: sri-kafka-sg
      GroupDescription: sri-kafka-sg
      VpcId: !Ref SriVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: 10.0.0.0/16

  SriKafkaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sri-kafka-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: sri-kafka-secret-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SriKafkaSecret

  SriKafkaInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: sri-kafka-profile
      Roles:
        - !Ref SriKafkaRole

  SriKafkaInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - SriPublicRoute
      - SriPublicSubnetRouteTable
    Properties:
      ImageId: ami-08be4b1b8afa29958
      InstanceType: c7i-flex.large
      SubnetId: !Ref SriPublicSubnet
      IamInstanceProfile: !Ref SriKafkaInstanceProfile
      SecurityGroupIds:
        - !GetAtt SriKafkaSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: sri-kafka
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          dnf install -y java-21-amazon-corretto-headless jq
          curl -fsSL https://archive.apache.org/dist/kafka/4.3.1/kafka_2.13-4.3.1.tgz | tar -xz -C /opt
          mv /opt/kafka_2.13-4.3.1 /opt/kafka

          IP=$(hostname -I | awk '{print $1}')
          SECRET=$(aws secretsmanager get-secret-value --region us-east-2 --secret-id "${SriKafkaSecret}" --query SecretString --output text)
          USERNAME=$(echo "$SECRET" | jq -r .username)
          PASSWORD=$(echo "$SECRET" | jq -r .password)
          JAAS="org.apache.kafka.common.security.scram.ScramLoginModule required username=\"$USERNAME\" password=\"$PASSWORD\";"

          cat > /opt/kafka/config/sri-server.properties <<EOF
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:9093
          listeners=SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
          advertised.listeners=SASL_PLAINTEXT://$IP:9092
          listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=SASL_PLAINTEXT
          sasl.enabled.mechanisms=SCRAM-SHA-512
          sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
          listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=$JAAS
          log.dirs=/opt/kafka/data
          offsets.topic.replication.factor=1
          EOF

          cat > /opt/kafka/config/sri-client.properties <<EOF
          security.protocol=SASL_PLAINTEXT
          sasl.mechanism=SCRAM-SHA-512
          sasl.jaas.config=$JAAS
          EOF

          /opt/kafka/bin/kafka-storage.sh format -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)" \
            -c /opt/kafka/config/sri-server.properties \
            --add-scram "SCRAM-SHA-512=[name=$USERNAME,password=$PASSWORD]"

          /opt/kafka/bin/kafka-server-start.sh -daemon /opt/kafka/config/sri-server.properties

Outputs:
  SriVpcId:
    Value: !Ref SriVpc
  SriKafkaInstanceId:
    Value: !Ref SriKafkaInstance
  SriKafkaBootstrapServers:
    Value: !Sub ${SriKafkaInstance.PrivateIp}:9092
  SriKafkaSecretArn:
    Value: !Ref SriKafkaSecret