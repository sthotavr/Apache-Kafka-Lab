AWSTemplateFormatVersion: "2010-09-09"
Description: Sri AWS Config detective and reactive security group controls (lab).

Resources:
  SriConfigBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  SriConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SriConfigBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt SriConfigBucket.Arn
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${SriConfigBucket.Arn}/*

  SriConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sri-config-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWS_ConfigRole

  SriConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      Name: sri-config-recorder
      RoleARN: !GetAtt SriConfigRole.Arn
      RecordingGroup:
        AllSupported: false
        ResourceTypes:
          - AWS::EC2::SecurityGroup

  SriConfigChannel:
    Type: AWS::Config::DeliveryChannel
    DependsOn: SriConfigBucketPolicy
    Properties:
      Name: sri-config-channel
      S3BucketName: !Ref SriConfigBucket

  SriLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sri-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSConfigRulesExecutionRole

  SriSgRuleLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sri-sg-rule-lambda
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt SriLambdaRole.Arn
      Code:
        ZipFile: |
          import json

          import boto3

          OPEN_CIDRS = {"0.0.0.0/0", "::/0"}

          config = boto3.client("config")


          def find_open_port(sg, ports):
              for perm in sg.get("ipPermissions", []):
                  cidrs = {r.get("cidrIp") for r in perm.get("ipv4Ranges", [])}
                  cidrs |= {r.get("cidrIpv6") for r in perm.get("ipv6Ranges", [])}
                  if not cidrs & OPEN_CIDRS:
                      continue
                  if perm.get("ipProtocol") == "-1":
                      low, high = 0, 65535
                  else:
                      low, high = perm.get("fromPort", 0), perm.get("toPort", 65535)
                  if not ports:
                      return f"ports {low}-{high} open to the internet"
                  if perm.get("ipProtocol") not in ("tcp", "udp", "-1"):
                      continue
                  hit = [p for p in ports if low <= p <= high]
                  if hit:
                      return f"port(s) {','.join(map(str, hit))} open to the internet"
              return None


          def handler(event, context):
              item = json.loads(event["invokingEvent"])["configurationItem"]
              params = json.loads(event.get("ruleParameters") or "{}")
              ports = [int(p) for p in params.get("restrictedPorts", "").split(",") if p]

              if item["configurationItemStatus"] == "ResourceDeleted":
                  result, note = "NOT_APPLICABLE", "Security group deleted"
              else:
                  reason = find_open_port(item["configuration"], ports)
                  result = "NON_COMPLIANT" if reason else "COMPLIANT"
                  note = reason or "No open ingress"

              config.put_evaluations(
                  Evaluations=[{
                      "ComplianceResourceType": item["resourceType"],
                      "ComplianceResourceId": item["resourceId"],
                      "ComplianceType": result,
                      "Annotation": note,
                      "OrderingTimestamp": item["configurationItemCaptureTime"],
                  }],
                  ResultToken=event["resultToken"],
              )

  SriConfigInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SriSgRuleLambda
      Principal: config.amazonaws.com

  SriRemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sri-remediation-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sri-remediation-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:GetManagedPrefixListEntries
                Resource: "*"

  SriConformancePack:
    Type: AWS::Config::ConformancePack
    DependsOn:
      - SriConfigInvoke
      - SriConfigRecorder
      - SriConfigChannel
    Properties:
      ConformancePackName: sri-conformance-pack
      TemplateBody: !Sub |
        Resources:
          SriDetectiveRule:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sri-detective-rule
              Scope:
                ComplianceResourceTypes:
                  - AWS::EC2::SecurityGroup
              Source:
                Owner: CUSTOM_LAMBDA
                SourceIdentifier: ${SriSgRuleLambda.Arn}
                SourceDetails:
                  - EventSource: aws.config
                    MessageType: ConfigurationItemChangeNotification
          SriReactiveRule:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sri-reactive-rule
              InputParameters:
                restrictedPorts: "22,3389,9092,9093"
              Scope:
                ComplianceResourceTypes:
                  - AWS::EC2::SecurityGroup
              Source:
                Owner: CUSTOM_LAMBDA
                SourceIdentifier: ${SriSgRuleLambda.Arn}
                SourceDetails:
                  - EventSource: aws.config
                    MessageType: ConfigurationItemChangeNotification
          SriRemediation:
            Type: AWS::Config::RemediationConfiguration
            DependsOn: SriReactiveRule
            Properties:
              ConfigRuleName: sri-reactive-rule
              TargetType: SSM_DOCUMENT
              TargetId: AWSConfigRemediation-RemoveUnrestrictedSourceIngressRules
              Automatic: true
              MaximumAutomaticAttempts: 3
              RetryAttemptSeconds: 60
              Parameters:
                SecurityGroupId:
                  ResourceValue:
                    Value: RESOURCE_ID
                AutomationAssumeRole:
                  StaticValue:
                    Values:
                      - ${SriRemediationRole.Arn}