version: 0.2

env:
  variables:
    TF_VERSION: "1.16.0"
    OPA_VERSION: "v1.9.0"

phases:
  install:
    commands:
      - curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o -q /tmp/terraform.zip -d /usr/local/bin
      - curl -fsSL -o /usr/local/bin/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
      - chmod +x /usr/local/bin/opa
      - terraform version
      - opa version
  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/terraform"
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"
      - terraform fmt -check
      - terraform validate
      - terraform plan -input=false -out=tfplan
      - terraform show -json tfplan > tfplan.json
      - opa eval --fail-defined --format raw -d ../opa -i tfplan.json 'data.terraform.deny[msg]'
      - terraform apply -input=false tfplan
      - terraform output